# ---------------------------------------------------------------------------
# TEMPLATE ONLY - this file documents which keys the backend needs. It contains
# no real values and is safe to commit.
#
# The real Secret is NEVER committed. It is created by CI from GitHub Actions
# secrets (see .github/workflows/ci-cd.yml, "Create/update backend Secret"):
#
#   kubectl create secret generic backend-secret -n demo \
#     --from-literal=API_KEY="..." \
#     --from-literal=DB_PASSWORD="..." \
#     --dry-run=client -o yaml | kubectl apply -f -
#
# The `--dry-run=client -o yaml | kubectl apply -f -` idiom is what makes this
# idempotent: plain `kubectl create secret` fails if the Secret already exists.
#
# To create it by hand while experimenting:
#   kubectl create secret generic backend-secret -n demo \
#     --from-literal=API_KEY=sk_live_localtestvalue \
#     --from-literal=DB_PASSWORD=localdevpassword
#
# IMPORTANT: Kubernetes Secrets are base64-ENCODED, not encrypted. Anyone with
# `get secrets` in this namespace can read them back in plaintext. Keeping the
# value out of git is a real win; it is not the same as encryption.
# ---------------------------------------------------------------------------
apiVersion: v1
kind: Secret
metadata:
  name: backend-secret
  namespace: demo
type: Opaque
stringData:
  API_KEY: "REPLACE_ME"
  DB_PASSWORD: "REPLACE_ME"
