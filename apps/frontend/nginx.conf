worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Everything nginx writes goes under /tmp, so the container image itself can
    # stay read-only (see readOnlyRootFilesystem in k8s/frontend.yaml).
    client_body_temp_path /tmp/client_temp;
    proxy_temp_path       /tmp/proxy_temp;
    fastcgi_temp_path     /tmp/fastcgi_temp;
    uwsgi_temp_path       /tmp/uwsgi_temp;
    scgi_temp_path        /tmp/scgi_temp;

    access_log /dev/stdout;
    sendfile   on;
    keepalive_timeout 65;

    # Do not advertise the exact nginx version to the internet.
    server_tokens off;

    server {
        # 8080, not 80: ports below 1024 need CAP_NET_BIND_SERVICE, which we drop.
        listen 8080;
        server_name _;

        root /usr/share/nginx/html;
        index index.html;

        # Probed by the kubelet. Kept separate from / so a probe never depends
        # on the page rendering correctly.
        location = /healthz {
            access_log off;
            return 200 "ok\n";
            add_header Content-Type text/plain;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }

        # NOTE: there is deliberately no /api proxy here. The Ingress routes
        # /api straight to the backend Service, so this container never sees
        # backend traffic. Proxying here as well would add a pointless hop.
    }
}
